<svg width="1600" height="520" viewBox="0 0 1600 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">GoreeWorks Concept 01 — Studio Commerce</title>
<desc id="desc">Premium GoreeWorks logo concept combining design-grid precision, ecommerce product framing, and a refined GW monogram.</desc>
<defs>
  <linearGradient id="blue" x1="86" y1="90" x2="374" y2="372" gradientUnits="userSpaceOnUse">
    <stop stop-color="#0A5CFF"/>
    <stop offset="1" stop-color="#4F46E5"/>
  </linearGradient>
  <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#0D1321"/>
    <stop offset="1" stop-color="#202938"/>
  </linearGradient>
</defs>

<!-- refined design-grid construction -->
<g opacity="0.12" stroke="#4A6FA5" stroke-width="1.5">
  <path d="M76 96H440M76 180H440M76 264H440M76 348H440"/>
  <path d="M110 62V404M194 62V404M278 62V404M362 62V404"/>
  <circle cx="258" cy="232" r="150"/>
</g>

<!-- monogram/product-frame -->
<g transform="translate(80 66)">
  <rect x="18" y="18" width="322" height="322" rx="74" fill="#F8FAFC" stroke="#DDE3EC" stroke-width="4"/>
  <path d="M91 101C113 77 145 63 181 63H254C270 63 283 76 283 92V125H185C155 125 131 149 131 179V230C131 260 155 284 185 284H254C270 284 283 271 283 255V223H205"
        stroke="url(#ink)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M145 191L180 257L215 191L250 257L285 191"
        stroke="url(#blue)" stroke-width="27" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="266" y="78" width="42" height="42" rx="12" fill="url(#blue)"/>
</g>

<!-- wordmark -->
<text x="510" y="276" fill="#0D1321"
  font-family="Inter, Avenir Next, Helvetica Neue, Arial, sans-serif"
  font-size="150" font-weight="760" letter-spacing="-7">Goree</text>
<text x="904" y="276" fill="#0A5CFF"
  font-family="Inter, Avenir Next, Helvetica Neue, Arial, sans-serif"
  font-size="150" font-weight="760" letter-spacing="-7">Works</text>
<text x="518" y="330" fill="#617086"
  font-family="Inter, Avenir Next, Helvetica Neue, Arial, sans-serif"
  font-size="28" font-weight="520" letter-spacing="5">DESIGN • COMMERCE • PRODUCTION</text>
</svg>