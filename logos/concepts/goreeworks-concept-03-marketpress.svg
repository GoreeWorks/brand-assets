<svg width="1600" height="520" viewBox="0 0 1600 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">GoreeWorks Concept 03 — MarketPress</title>
<desc id="desc">GoreeWorks logo concept blending packaging, storefront, layered media, and creative production into a premium geometric identity.</desc>
<defs>
  <linearGradient id="top" x1="130" y1="84" x2="308" y2="197" gradientUnits="userSpaceOnUse">
    <stop stop-color="#146CFF"/>
    <stop offset="1" stop-color="#5146E5"/>
  </linearGradient>
  <linearGradient id="side" x1="80" y1="162" x2="160" y2="330" gradientUnits="userSpaceOnUse">
    <stop stop-color="#15D0C0"/>
    <stop offset="1" stop-color="#1389D5"/>
  </linearGradient>
  <linearGradient id="front" x1="190" y1="170" x2="330" y2="360" gradientUnits="userSpaceOnUse">
    <stop stop-color="#0E172A"/>
    <stop offset="1" stop-color="#2B3548"/>
  </linearGradient>
</defs>

<!-- geometric storefront/package mark -->
