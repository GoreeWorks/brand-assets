  <path d="M165 135H208L197 177C194 188 185 195 175 195C164 195 155 188 152 177L148 164L165 135Z" fill="#13B8A6"/>
  <path d="M208 135H251L240 177C237 188 228 195 218 195C207 195 198 188 195 177L192 164L208 135Z" fill="#06A8F0"/>
  <path d="M251 135H294L283 177C280 188 271 195 261 195C250 195 241 188 238 177L235 164L251 135Z" fill="#1567F4"/>
  <path d="M294 135H339L327 177C324 188 315 195 305 195C294 195 285 188 282 177L279 164L294 135Z" fill="#12B8A6"/>

  <!-- G on front -->
  <path d="M189 230C202 216 220 208 241 208H280V239H243C225 239 211 253 211 271C211 289 225 303 243 303H278V290H253V265H310V298C310 318 294 334 274 334H242C202 334 170 302 170 262C170 250 173 239 178 230Z" fill="white"/>
