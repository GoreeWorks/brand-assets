<svg width="1600" height="520" viewBox="0 0 1600 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">GoreeWorks Concept 02 — Print Grid</title>
<desc id="desc">GoreeWorks logo concept using layered print sheets, registration marks, CMYK-inspired accents, and precise production geometry.</desc>
<defs>
  <linearGradient id="sheetC" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#06B6D4"/>
    <stop offset="1" stop-color="#2563EB"/>
  </linearGradient>
  <linearGradient id="ink2" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#0B0F17"/>
    <stop offset="1" stop-color="#303949"/>
  </linearGradient>
</defs>

<!-- registration/crop language -->
<g transform="translate(88 74)">
  <g stroke="#182230" stroke-width="3" opacity="0.55">
    <path d="M0 86H54M27 59V113"/>
    <path d="M0 330H54M27 303V357"/>
    <path d="M348 86H402M375 59V113"/>
    <path d="M348 330H402M375 303V357"/>
  </g>

  <!-- layered print sheets -->
  <path d="M82 250L196 315L310 250L196 185L82 250Z" fill="#FACC15"/>
  <path d="M82 221L196 286L310 221L196 156L82 221Z" fill="#EC0A8C"/>
  <path d="M82 192L196 257L310 192L196 127L82 192Z" fill="url(#sheetC)"/>
  <path d="M82 163L196 228L310 163L196 98L82 163Z" fill="url(#ink2)"/>

  <!-- G cut into top sheet -->
  <path d="M152 132C166 117 185 108 207 108H247V139H208C190 139 176 153 176 171C176 189 190 203 208 203H245V189H218V165H278V201C278 220 262 236 243 236H207C167 236 135 204 135 164C135 152 138 141 143 132Z" fill="white"/>

  <!-- registration target -->
  <g transform="translate(320 34)">
    <circle cx="34" cy="34" r="29" fill="white" stroke="#182230" stroke-width="3"/>
    <path d="M34 5A29 29 0 0 1 63 34H34V5Z" fill="#06B6D4"/>
    <path d="M63 34A29 29 0 0 1 34 63V34H63Z" fill="#EC0A8C"/>
    <path d="M34 63A29 29 0 0 1 5 34H34V63Z" fill="#FACC15"/>
    <path d="M5 34A29 29 0 0 1 34 5V34H5Z" fill="#111827"/>
    <path d="M34 -10V78M-10 34H78" stroke="#182230" stroke-width="2"/>
  </g>
</g>

<!-- wordmark -->
<text x="530" y="266" fill="#101722"
  font-family="Inter, Avenir Next, Helvetica Neue, Arial, sans-serif"
  font-size="150" font-weight="770" letter-spacing="-7">Goree</text>
<text x="924" y="266" fill="#354154"
  font-family="Inter, Avenir Next, Helvetica Neue, Arial, sans-serif"
  font-size="150" font-weight="720" letter-spacing="-7">Works</text>
<g transform="translate(540 314)">
  <rect width="18" height="18" rx="4" fill="#06B6D4"/>
  <rect x="30" width="18" height="18" rx="4" fill="#EC0A8C"/>
  <rect x="60" width="18" height="18" rx="4" fill="#FACC15"/>
  <rect x="90" width="18" height="18" rx="4" fill="#111827"/>
  <text x="136" y="17" fill="#687386"
    font-family="Inter, Avenir Next, Helvetica Neue, Arial, sans-serif"
    font-size="24" font-weight="560" letter-spacing="4">CREATIVE PRODUCTION SYSTEMS</text>
</g>
</svg>