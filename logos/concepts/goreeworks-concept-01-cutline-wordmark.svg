<svg width="1700" height="500" viewBox="0 0 1700 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">GoreeWorks Concept 01 — Cutline Wordmark</title>
<desc id="desc">Typography-first GoreeWorks identity using a precise production cutline as the signature brand device.</desc>
<rect width="1700" height="500" fill="#F7F3EC"/>
<text x="110" y="308" fill="#121214" font-family="Arial Black, Helvetica Neue, Arial, sans-serif" font-size="192" font-weight="900" letter-spacing="-10">Goree</text>
<text x="782" y="308" fill="#121214" font-family="Arial Black, Helvetica Neue, Arial, sans-serif" font-size="192" font-weight="900" letter-spacing="-10">Works</text>
<!-- signature cutline -->
<path d="M740 108L806 108L748 392H682L740 108Z" fill="#FF4B2B"/>
<!-- production ticks -->
<path d="M704 92H650V112H704" stroke="#121214" stroke-width="8" stroke-linecap="square"/>
