<svg width="1600" height="520" viewBox="0 0 1600 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">GoreeWorks Concept 02 — Catalog Grid</title>
<desc id="desc">An abstract layout symbol based on ecommerce product cards, graphic grids, and print imposition.</desc>
<rect width="1600" height="520" fill="#F7F4ED"/>
<g transform="translate(92 78)">
  <!-- modular catalog grid -->
  <rect x="12" y="12" width="128" height="128" rx="26" fill="#18202F"/>
  <rect x="158" y="12" width="182" height="128" rx="26" fill="#18202F"/>
  <rect x="12" y="158" width="182" height="182" rx="26" fill="#18202F"/>
  <rect x="212" y="158" width="128" height="182" rx="26" fill="#FF6B35"/>
  <!-- negative-space image/text slots -->
  <rect x="44" y="46" width="64" height="24" rx="12" fill="#F7F4ED"/>
  <rect x="190" y="46" width="118" height="24" rx="12" fill="#F7F4ED"/>
  <rect x="44" y="196" width="118" height="30" rx="15" fill="#F7F4ED"/>
  <rect x="44" y="244" width="86" height="22" rx="11" fill="#F7F4ED"/>
  <!-- small registration / selection dot -->
  <circle cx="276" cy="278" r="24" fill="#F7F4ED"/>
</g>
<text x="520" y="314" fill="#18202F"
      font-family="Avenir Next, Helvetica Neue, Arial, sans-serif"
      font-size="182" font-weight="720" letter-spacing="-9">GoreeWorks</text>
</svg>