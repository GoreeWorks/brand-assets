<svg width="1600" height="520" viewBox="0 0 1600 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">GoreeWorks Concept 03 — Folded Flow</title>
<desc id="desc">An abstract continuous symbol derived from brochure folds, packaging panels, and digital commerce flow.</desc>
<rect width="1600" height="520" fill="#FBF7F1"/>
<g transform="translate(88 82)">
  <!-- accordion brochure / packaging strip -->
  <path d="M18 84L118 34L218 84L318 34L318 278L218 328L118 278L18 328V84Z" fill="#1C2434"/>
  <!-- alternating panel cutouts -->
  <path d="M68 112L118 88L168 112V238L118 262L68 238V112Z" fill="#FBF7F1"/>
  <path d="M218 112L268 88V238L218 262V112Z" fill="#FBF7F1"/>
  <!-- commerce/output accent panel -->
  <path d="M268 88L318 62V278L268 302V88Z" fill="#14B8A6"/>
  <!-- print registration dot -->
  <circle cx="292" cy="98" r="14" fill="#FBF7F1"/>
</g>
<text x="520" y="314" fill="#1C2434"
      font-family="Avenir Next, Helvetica Neue, Arial, sans-serif"
      font-size="182" font-weight="720" letter-spacing="-9">GoreeWorks</text>
</svg>