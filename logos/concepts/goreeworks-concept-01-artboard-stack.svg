<svg width="1600" height="520" viewBox="0 0 1600 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">GoreeWorks Concept 01 — Artboard Stack</title>
<desc id="desc">An abstract symbol derived from layered design artboards, printed sheets, and product cards.</desc>
<rect width="1600" height="520" fill="#FAF8F2"/>
<g transform="translate(88 74)">
  <!-- layered artboards / sheets -->
  <rect x="28" y="38" width="238" height="278" rx="28" fill="#F3A712"/>
  <rect x="72" y="18" width="238" height="278" rx="28" fill="#EE5B46"/>
  <rect x="116" y="58" width="238" height="278" rx="28" fill="#17233C"/>
  <!-- product-card / layout window -->
  <rect x="170" y="112" width="130" height="106" rx="18" fill="#FAF8F2"/>
  <!-- print trim notch -->
  <path d="M116 270H178V332H150C131 332 116 317 116 298V270Z" fill="#FAF8F2"/>
</g>
<text x="520" y="314" fill="#17233C"
      font-family="Avenir Next, Helvetica Neue, Arial, sans-serif"
      font-size="182" font-weight="720" letter-spacing="-9">GoreeWorks</text>
</svg>