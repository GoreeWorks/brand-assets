<svg width="1440" height="420" viewBox="0 0 1440 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">GoreeWorks primary logo</title>
  <desc id="desc">A modern GoreeWorks logo featuring a geometric GW monogram and wordmark.</desc>
  <defs>
    <linearGradient id="gwGradient" x1="54" y1="52" x2="318" y2="326" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="0.52" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="838" y1="120" x2="1080" y2="290" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- GoreeWorks monogram -->
  <g transform="translate(42 42)">
    <rect width="336" height="336" rx="88" fill="url(#gwGradient)"/>
    <path d="M246 97C226 75 198 62 166 62C107 62 60 109 60 168C60 227 107 274 166 274C211 274 249 247 264 208H188"
          stroke="white" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M94 172L131 248L168 172L205 248L242 172"
          stroke="white" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="265" cy="103" r="10" fill="white" opacity="0.94"/>
  </g>

  <!-- Wordmark -->
  <g>
    <text x="438" y="250"
          fill="#0B1020"
          font-family="Inter, Avenir Next, Segoe UI, Helvetica Neue, Arial, sans-serif"
          font-size="132"
          font-weight="760"
          letter-spacing="-6">Goree</text>
    <text x="790" y="250"
          fill="url(#accentGradient)"
          font-family="Inter, Avenir Next, Segoe UI, Helvetica Neue, Arial, sans-serif"
          font-size="132"
          font-weight="760"
          letter-spacing="-6">Works</text>
    <rect x="442" y="286" width="534" height="10" rx="5" fill="#0B1020" opacity="0.07"/>
    <rect x="442" y="286" width="184" height="10" rx="5" fill="url(#accentGradient)"/>
  </g>
</svg>